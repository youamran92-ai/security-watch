  - {name: ReliefWeb disasters,  url: "https://reliefweb.int/disasters/rss.xml",      specialist: true, domain: disaster}
  - {name: WHO news,             url: "https://www.who.int/rss-feeds/news-english.xml", specialist: true, domain: health}

# ── 2. GOOGLE NEWS SEARCHES ──────────────────────────────────────────────────
#  Each search scans thousands of outlets. This is what guarantees every
#  region is covered, including places the feeds above rarely mention.
#  Query syntax: OR between words, "quotes" for phrases.
google_news:
  enabled: true
  when: 1d               # only stories from the last day
  language: en-US        # change to fr-FR, es-419, pt-BR, ar … for other editions
  country: US
  # Security words added to every regional search below:
  security_terms: '(attack OR military OR troops OR militants OR coup OR protest OR clashes OR killed OR sanctions)'
  regional:
    - {hint: North Africa,               places: 'Egypt OR Libya OR Tunisia OR Algeria OR Morocco OR "Western Sahara"'}
    - {hint: West Africa,                places: 'Mali OR "Burkina Faso" OR Niger OR Nigeria OR Ghana OR Senegal OR "Ivory Coast" OR Guinea OR Benin OR Togo OR Sahel OR Mauritania'}
    - {hint: Central Africa,             places: 'Congo OR DRC OR Cameroon OR Chad OR "Central African Republic" OR Gabon'}
    - {hint: East Africa & Horn,         places: 'Sudan OR "South Sudan" OR Ethiopia OR Somalia OR Kenya OR Eritrea OR Uganda OR Rwanda OR Burundi OR Djibouti'}
    - {hint: Southern Africa,            places: 'Mozambique OR Zimbabwe OR "South Africa" OR Angola OR Zambia OR Malawi OR Madagascar OR Namibia'}
    - {hint: Levant,                     places: 'Israel OR Gaza OR "West Bank" OR Lebanon OR Syria OR Jordan'}
    - {hint: Gulf & Arabian Peninsula,   places: 'Yemen OR Houthis OR "Saudi Arabia" OR UAE OR Qatar OR Oman OR Bahrain OR Kuwait OR "Red Sea"'}
    - {hint: "Iran, Iraq & Türkiye",     places: 'Iran OR Iraq OR Turkey OR Kurdish'}
    - {hint: Eastern Europe & Caucasus,  places: 'Ukraine OR Russia OR Belarus OR Moldova OR Georgia OR Armenia OR Azerbaijan'}
    - {hint: Central Europe & Balkans,   places: 'Poland OR Serbia OR Kosovo OR Bosnia OR Hungary OR Romania OR Balkans'}
    - {hint: Northern Europe,            places: 'Baltic OR Finland OR Sweden OR Norway OR Estonia OR Latvia OR Lithuania OR Denmark'}
    - {hint: Western Europe,             places: 'Britain OR France OR Germany OR Netherlands OR Belgium OR NATO'}
    - {hint: Southern Europe,            places: 'Italy OR Spain OR Greece OR Cyprus OR Mediterranean'}
    - {hint: East Asia,                  places: 'China OR Taiwan OR "North Korea" OR "South Korea" OR Japan'}
    - {hint: Southeast Asia,             places: 'Myanmar OR Philippines OR Thailand OR Indonesia OR Vietnam OR Cambodia OR "South China Sea"'}
    - {hint: South Asia,                 places: 'India OR Pakistan OR Afghanistan OR Bangladesh OR Kashmir OR "Sri Lanka" OR Nepal'}
    - {hint: Central Asia,               places: 'Kazakhstan OR Uzbekistan OR Kyrgyzstan OR Tajikistan OR Turkmenistan'}
    - {hint: North America,              places: '"United States" OR Pentagon OR Canada OR Mexico OR Greenland'}
    - {hint: Central America & Caribbean, places: 'Haiti OR Cuba OR Guatemala OR Honduras OR "El Salvador" OR Nicaragua OR Panama OR Caribbean'}
    - {hint: South America,              places: 'Venezuela OR Colombia OR Ecuador OR Peru OR Brazil OR Bolivia OR Argentina OR Chile OR Guyana'}
    - {hint: Australia & New Zealand,    places: 'Australia OR "New Zealand" OR AUKUS'}
    - {hint: Pacific Islands,            places: '"Papua New Guinea" OR Fiji OR "Solomon Islands" OR Vanuatu OR "Pacific Islands" OR "New Caledonia"'}
    - {hint: Arctic,                     places: 'Arctic OR Svalbard OR "High North"'}
    - {hint: Antarctica,                 places: 'Antarctica OR Antarctic'}
  # Topic searches (worldwide):
  topical:
    - {domain: cyber,     query: 'cyberattack OR ransomware OR "state-sponsored hackers" OR "data breach"'}
    - {domain: maritime,  query: 'piracy OR "tanker seized" OR "naval standoff" OR "undersea cable" OR "shadow fleet"'}
    - {domain: wmd,       query: '"nuclear test" OR "ballistic missile" OR "uranium enrichment" OR IAEA OR "chemical weapons"'}
    - {domain: health,    query: 'outbreak OR epidemic OR cholera OR ebola OR mpox OR famine'}
    - {domain: migration, query: 'migrants OR refugees OR "border crossing" OR displaced OR asylum'}
    - {domain: crime,     query: 'cartel OR "drug trafficking" OR "human trafficking" OR "organised crime"'}
    - {domain: space,     query: 'satellite OR "GPS jamming" OR "anti-satellite" OR "space force"'}
    - {domain: economic,  query: '"export controls" OR "critical minerals" OR "energy security" OR "oil supply"'}

# ── 3. GDELT ─────────────────────────────────────────────────────────────────
#  GDELT watches news worldwide and refreshes every 15 minutes.
#  One search per domain; GDELT allows one request every 5 seconds.
gdelt:
  # Turned off: GDELT's servers time out or refuse requests coming from
  # GitHub's machines. Google News covers the same ground. Set to true to retry.
  enabled: false
  timespan: 3h           # look-back per run
  max_per_query: 250
  languages: [english]   # add e.g. french, spanish, portuguese, arabic
  # A few broad searches rather than one per domain: GDELT is often slow, and
  # fewer, bigger requests get through more reliably. Headlines are sorted into
  # domains by keyword afterwards. A key that matches a domain id (e.g.
  # "conflict") also tags every result with that domain.
  queries:
    security: '(airstrike OR shelling OR coup OR terrorist OR militants OR "armed clashes" OR insurgents)'
    threats:  '(cyberattack OR ransomware OR sanctions OR "ballistic missile" OR piracy OR warship)'
    hazards:  '(outbreak OR earthquake OR flooding OR cyclone OR refugees OR famine)'

