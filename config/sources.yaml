  - {name: Maritime Executive,   url: "https://maritime-executive.com/articles.rss",  specialist: true, domain: maritime}
  - {name: OilPrice,             url: "https://oilprice.com/rss/main",                specialist: true, domain: economic}
  - {name: SpaceNews,            url: "https://spacenews.com/feed/",                  specialist: true, domain: space}

  # Disasters, health, humanitarian
  - {name: GDACS alerts,         url: "https://www.gdacs.org/xml/rss.xml",            specialist: true, domain: disaster, drop_if: "^Green"}
