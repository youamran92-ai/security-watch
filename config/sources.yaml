# ─────────────────────────────────────────────────────────────────────────────
#  SOURCES — everything the dashboard pulls in
#
#  Edit this file on github.com (pencil icon) to add or remove sources.
#  Changes take effect on the next run (within ~20 minutes), or right away
#  if you run the workflow by hand from the Actions tab.
#
#  A source that stops working never breaks the dashboard: it is skipped and
#  shown as failing on the "Sources" tab, so you can fix or remove it.
# ─────────────────────────────────────────────────────────────────────────────

settings:
  window_hours: 48          # how far back the dashboard keeps reports
  max_items: 6000           # hard cap to keep the page fast
  title: Security Watch     # shown at the top of the page

# ── 1. RSS / ATOM FEEDS ──────────────────────────────────────────────────────
#  name:          label shown on the dashboard
#  url:           the feed address
#  specialist:    true  → keep every item (the outlet only covers security topics)
#                 false → keep only items that match a security domain (default)
#  domain:        topic to use when a specialist item matches no keyword list
#  hint:          where to file items that mention no place by name
#                 (a continent, region or country exactly as written in places.yaml)
#  drop_if:       regex — skip items whose headline matches
#  min_magnitude: for earthquake feeds — skip anything smaller
feeds:
  # Global news desks (filtered to security-relevant stories)
  - {name: BBC World,            url: "https://feeds.bbci.co.uk/news/world/rss.xml"}
  - {name: BBC Africa,           url: "https://feeds.bbci.co.uk/news/world/africa/rss.xml",        hint: Africa}
  - {name: BBC Asia,             url: "https://feeds.bbci.co.uk/news/world/asia/rss.xml",          hint: Asia}
  - {name: BBC Europe,           url: "https://feeds.bbci.co.uk/news/world/europe/rss.xml",        hint: Europe}
  - {name: BBC Latin America,    url: "https://feeds.bbci.co.uk/news/world/latin_america/rss.xml", hint: Americas}
  - {name: BBC Middle East,      url: "https://feeds.bbci.co.uk/news/world/middle_east/rss.xml",   hint: Middle East}
  - {name: BBC US & Canada,      url: "https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml", hint: North America}
  - {name: Al Jazeera,           url: "https://www.aljazeera.com/xml/rss/all.xml"}
  - {name: The Guardian World,   url: "https://www.theguardian.com/world/rss"}
  - {name: France 24,            url: "https://www.france24.com/en/rss"}
  - {name: France 24 Africa,     url: "https://www.france24.com/en/africa/rss",                    hint: Africa}
  - {name: DW,                   url: "https://rss.dw.com/rdf/rss-en-all"}
  - {name: NPR World,            url: "https://feeds.npr.org/1004/rss.xml"}
  - {name: UN News,              url: "https://news.un.org/feed/subscribe/en/news/all/rss.xml"}

  # Regional desks
  - {name: AllAfrica,            url: "https://allafrica.com/tools/headlines/rdf/latest/headlines.rdf", hint: Africa}
  - {name: Africanews,           url: "https://www.africanews.com/feed/rss",                       hint: Africa}
  - {name: Premium Times (NG),   url: "https://www.premiumtimesng.com/feed",                       hint: Nigeria}
  - {name: Daily Maverick (ZA),  url: "https://www.dailymaverick.co.za/dmrss/",                    hint: South Africa}
  - {name: Middle East Eye,      url: "https://www.middleeasteye.net/rss",                         hint: Middle East}
  - {name: The Diplomat,         url: "https://thediplomat.com/feed/",                             hint: Asia}
  - {name: Asia Times,           url: "https://asiatimes.com/feed/",                               hint: Asia}
  - {name: SCMP China,           url: "https://www.scmp.com/rss/4/feed",                           hint: China}
  - {name: Meduza (English),     url: "https://meduza.io/rss/en/all",                              hint: Russia}
  - {name: Balkan Insight,       url: "https://balkaninsight.com/feed/",                           hint: Central Europe & Balkans}
  - {name: Euractiv,             url: "https://www.euractiv.com/feed/",                            hint: Europe}
  - {name: MercoPress,           url: "https://en.mercopress.com/rss",                             hint: South America}
  - {name: RNZ Pacific,          url: "https://www.rnz.co.nz/rss/pacific.xml",                     hint: Pacific Islands}
  - {name: Guardian Australia,   url: "https://www.theguardian.com/australia-news/rss",            hint: Australia}

  # Specialist security outlets (every item kept)
  - {name: Crisis Group,         url: "https://www.crisisgroup.org/rss.xml",          specialist: true, domain: political}
  - {name: War on the Rocks,     url: "https://warontherocks.com/feed/",              specialist: true, domain: conflict}
  - {name: Defense One,          url: "https://www.defenseone.com/rss/all/",          specialist: true, domain: conflict}
  - {name: Breaking Defense,     url: "https://breakingdefense.com/feed/",            specialist: true, domain: conflict}
  - {name: The War Zone,         url: "https://www.twz.com/feed",                     specialist: true, domain: conflict}
  - {name: Long War Journal,     url: "https://www.longwarjournal.org/feed",          specialist: true, domain: terrorism}
  - {name: Bellingcat,           url: "https://www.bellingcat.com/feed/",             specialist: true, domain: conflict}
  - {name: Just Security,        url: "https://www.justsecurity.org/feed/",           specialist: true, domain: diplomacy}
  - {name: InSight Crime,        url: "https://insightcrime.org/feed/",               specialist: true, domain: crime, hint: Americas}
  - {name: Arms Control Wonk,    url: "https://www.armscontrolwonk.com/feed/",        specialist: true, domain: wmd}
  - {name: UN News Peace & Security, url: "https://news.un.org/feed/subscribe/en/news/topic/peace-and-security/feed/rss.xml", specialist: true, domain: conflict}

