        - {hint: Southeast Asia,   places: '南海 OR 菲律賓'}
        - {hint: North Korea,      places: '北韓 OR 朝鮮'}
    - lang: tr
      hl: tr
      gl: TR
      ceid: "TR:tr"
      security_terms: '(saldırı OR asker OR operasyon OR terör OR çatışma OR protesto)'
      queries:
        - {hint: "Iran, Iraq & Türkiye", places: 'Türkiye OR Suriye OR Irak OR İran'}
    - lang: id
      hl: id
      gl: ID
      ceid: "ID:id"
      security_terms: '(serangan OR militer OR TNI OR teroris OR bentrok OR demo)'
      queries:
        - {hint: Southeast Asia,   places: 'Indonesia OR Papua OR Filipina OR Myanmar OR "Laut China Selatan"'}
    - lang: hi
      hl: hi
      gl: IN
      ceid: "IN:hi"
      security_terms: '(हमला OR सेना OR आतंकवादी OR मुठभेड़ OR सीमा)'
      queries:
        - {hint: South Asia,       places: 'भारत OR पाकिस्तान OR कश्मीर OR मणिपुर OR बांग्लादेश'}
    - lang: ja
      hl: ja
      gl: JP
      ceid: "JP:ja"
