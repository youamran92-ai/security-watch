# ─────────────────────────────────────────────────────────────────────────────
#  SOURCES — everything the dashboard pulls in
#
#  Edit this file on github.com (pencil icon) to add or remove sources.
#  Changes take effect on the next run (within ~20 minutes), or right away
#  if you run the workflow by hand from the Actions tab.
#
#  A source that stops working never breaks the dashboard: it is skipped and
#  shown as failing on the "Sources" tab, so you can fix or remove it.
# ─────────────────────────────────────────────────────────────────────────────

settings:
  window_hours: 48          # how far back the dashboard keeps reports
  max_items: 6000           # hard cap to keep the page fast
  title: Security Watch     # shown at the top of the page

# ── 1. RSS / ATOM FEEDS ──────────────────────────────────────────────────────
#  name:          label shown on the dashboard
#  url:           the feed address
#  specialist:    true  → keep every item (the outlet only covers security topics)
#                 false → keep only items that match a security domain (default)
#  domain:        topic to use when a specialist item matches no keyword list
#  hint:          where to file items that mention no place by name
#                 (a continent, region or country exactly as written in places.yaml)
#  drop_if:       regex — skip items whose headline matches
#  min_magnitude: for earthquake feeds — skip anything smaller
#  lang:          language of the feed (fr, es, ar …). Non-English headlines are
#                 translated to English automatically. Default: en
feeds:
