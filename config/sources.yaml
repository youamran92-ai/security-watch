# ── 3. GDELT ─────────────────────────────────────────────────────────────────
#  GDELT watches news worldwide and refreshes every 15 minutes.
#  One search per domain; GDELT allows one request every 5 seconds.
gdelt:
  # Turned off: GDELT's servers time out or refuse requests coming from
  # GitHub's machines. Google News covers the same ground. Set to true to retry.
  enabled: false
  timespan: 3h           # look-back per run
  max_per_query: 250
  languages: [english]   # add e.g. french, spanish, portuguese, arabic
  # A few broad searches rather than one per domain: GDELT is often slow, and
  # fewer, bigger requests get through more reliably. Headlines are sorted into
  # domains by keyword afterwards. A key that matches a domain id (e.g.
  # "conflict") also tags every result with that domain.
  queries:
    security: '(airstrike OR shelling OR coup OR terrorist OR militants OR "armed clashes" OR insurgents)'
    threats:  '(cyberattack OR ransomware OR sanctions OR "ballistic missile" OR piracy OR warship)'
    hazards:  '(outbreak OR earthquake OR flooding OR cyclone OR refugees OR famine)'

# ── 3b. BING NEWS ────────────────────────────────────────────────────────────
#  A second search engine: runs the same English searches as Google News above,
#  so stories Google misses still come through. Duplicates are merged.
bing_news:
  enabled: true
  market: en-US
  use_google_queries: true

# ── 3c. GDELT EVENT FILES ────────────────────────────────────────────────────
#  GDELT also publishes its raw event data as files every 15 minutes, from a
#  different server than the search above. Each event comes with a location
#  and type (protest, assault, fighting, mass violence…). Headlines are built
#  from the article's web address, so they read a little rough.
gdelt_files:
  enabled: true
  files: 2               # how many 15-minute files to read per run
  event_types: [14, 17, 18, 19, 20]   # protest, coerce, assault, fight, mass violence
  min_sources: 1

# ── 4. REFERENCE DESK ────────────────────────────────────────────────────────
#  The "Links" tab: live maps, trackers and institutions — your start page.
links:
  - group: Live maps & conflict trackers
    items:
      - {name: Liveuamap,          url: "https://liveuamap.com",                         note: "Live incident maps by country"}
      - {name: ACLED,              url: "https://acleddata.com",                         note: "Political violence & protest data"}
      - {name: CrisisWatch,        url: "https://www.crisisgroup.org/crisiswatch",       note: "Monthly conflict tracker, 70+ countries"}
      - {name: ISW,                url: "https://www.understandingwar.org",              note: "Daily campaign assessments"}
      - {name: UCDP,               url: "https://ucdp.uu.se",                            note: "Uppsala conflict data"}
  - group: Disasters & hazards
    items:
      - {name: GDACS,              url: "https://www.gdacs.org",                         note: "Global disaster alerts"}
      - {name: USGS Earthquakes,   url: "https://earthquake.usgs.gov/earthquakes/map/",  note: "Live quake map"}
      - {name: NASA FIRMS,         url: "https://firms.modaps.eosdis.nasa.gov/map/",     note: "Active fires by satellite"}
      - {name: Windy,              url: "https://www.windy.com",                         note: "Storms & weather"}
      - {name: ReliefWeb,          url: "https://reliefweb.int",                         note: "Humanitarian updates"}
  - group: Air, sea & space
    items:
      - {name: ADS-B Exchange,     url: "https://globe.adsbexchange.com",                note: "Unfiltered flight tracking, incl. military"}
      - {name: Flightradar24,      url: "https://www.flightradar24.com",                 note: "Flight tracking"}
      - {name: MarineTraffic,      url: "https://www.marinetraffic.com",                 note: "Ship tracking"}
      - {name: GPSJam,             url: "https://gpsjam.org",                            note: "Daily GPS interference map"}
      - {name: CelesTrak,          url: "https://celestrak.org",                         note: "Satellite orbits"}
  - group: Cyber & internet
    items:
      - {name: Cloudflare Radar,   url: "https://radar.cloudflare.com",                  note: "Internet outages & attacks"}
      - {name: IODA,               url: "https://ioda.inetintel.cc.gatech.edu",          note: "Internet shutdown detection"}
      - {name: NetBlocks,          url: "https://netblocks.org",                         note: "Connectivity reports"}
      - {name: CISA KEV,           url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog", note: "Actively exploited vulnerabilities"}
      - {name: Ransomware.live,    url: "https://www.ransomware.live",                   note: "Ransomware victim tracker"}
  - group: Health, food & displacement
    items:
      - {name: WHO Outbreak News,  url: "https://www.who.int/emergencies/disease-outbreak-news", note: "Official outbreak notices"}
      - {name: FEWS NET,           url: "https://fews.net",                              note: "Famine early warning"}
      - {name: UNHCR Data,         url: "https://data.unhcr.org",                        note: "Refugee situations"}
      - {name: IOM DTM,            url: "https://dtm.iom.int",                           note: "Displacement tracking"}
      - {name: OCHA,               url: "https://www.unocha.org",                        note: "Humanitarian coordination"}
  - group: Institutions
    items:
      - {name: UN Security Council, url: "https://press.un.org/en/content/security-council", note: "Meetings & statements"}
      - {name: AU Peace & Security Council, url: "https://www.peaceau.org",             note: "African Union PSC"}
      - {name: ECOWAS,             url: "https://ecowas.int",                            note: "West African bloc"}
      - {name: NATO News,          url: "https://www.nato.int/cps/en/natohq/news.htm",   note: "Alliance news"}
      - {name: EU External Action, url: "https://www.eeas.europa.eu",                    note: "EU foreign & security policy"}
      - {name: ASEAN,              url: "https://asean.org",                             note: "Southeast Asian bloc"}
      - {name: OSCE,               url: "https://www.osce.org",                          note: "European security body"}
      - {name: IAEA,               url: "https://www.iaea.org/newscenter",               note: "Nuclear watchdog"}
  - group: Analysis
    items:
      - {name: ISS Africa,         url: "https://issafrica.org",                         note: "African security analysis"}
      - {name: IISS,               url: "https://www.iiss.org",                          note: "Military balance & strategy"}
      - {name: CSIS,               url: "https://www.csis.org",                          note: "Strategic & international studies"}
      - {name: RUSI,               url: "https://www.rusi.org",                          note: "Defence & security"}
      - {name: Chatham House,      url: "https://www.chathamhouse.org",                  note: "International affairs"}
      - {name: SIPRI,              url: "https://www.sipri.org",                         note: "Arms, military spending"}
      - {name: Lowy Institute,     url: "https://www.lowyinstitute.org",                 note: "Indo-Pacific analysis"}
      - {name: ORF,                url: "https://www.orfonline.org",                     note: "South Asia analysis"}
      - {name: Carnegie Endowment, url: "https://carnegieendowment.org",                 note: "Global policy research"}
  - group: Raw data
    items:
      - {name: GDELT,              url: "https://www.gdeltproject.org",                  note: "The global news engine behind this page"}
      - {name: GDELT GEO map,      url: "https://api.gdeltproject.org/api/v2/geo/geo?query=protest&format=html", note: "Ad-hoc news maps"}
