# ─────────────────────────────────────────────────────────────────────────────
#  PLACES — how headlines get sorted by geography
#
#  Structure:  Continent → Region → Country: [other words that point to it]
#
#  • The country's own name is always matched; list extra words after it
#    (demonyms, capitals, cities, provinces, armed groups based there).
#  • "_terms" are words that point to a whole region or continent
#    (e.g. "Sahel" → West Africa) without naming a specific country.
#  • ALL-CAPS short words (US, DRC, IDF) are matched case-sensitively.
#  • Longer phrases win over shorter ones, so "South Sudan" never counts
#    as "Sudan", and "Lake Chad" never counts as "Chad".
#  • A country can use {aliases: [...], exclude: "regex"} to skip headlines
#    that contain a confusing phrase (see Georgia).
#  • Cities that mostly appear as meeting venues (Geneva, Brussels, Vienna,
#    The Hague, Doha) are deliberately left out, so "talks in Geneva" doesn't
#    make Switzerland look like a hotspot.
# ─────────────────────────────────────────────────────────────────────────────

