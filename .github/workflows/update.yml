# Runs the news collector every 20 minutes and publishes the dashboard.
# You don't need to edit this file.
name: Update dashboard

on:
  schedule:
    - cron: "7,27,47 * * * *"     # every 20 minutes (times are UTC)
  workflow_dispatch:               # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["config/**", "site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write    # for the monthly keep-alive note
  pages: write       # to publish the site
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Translation models are downloaded once, then reused from this cache.
      - name: Restore translation models
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/securitywatch-models
          key: translation-models-v2-${{ github.run_id }}
          restore-keys: |
            translation-models-v2-
            translation-models-v1-

      - name: Collect and tag the news
        id: collect
        run: python scripts/fetch.py --out _site

      # Only saves when a new language model was downloaded this run.
      - name: Save translation models
        if: steps.collect.outputs.models_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/securitywatch-models
          key: translation-models-v2-${{ github.run_id }}

      # GitHub pauses scheduled jobs after 60 days without repository activity.
      # This writes the month into a small file once a month so that never happens.
      - name: Monthly keep-alive
        run: |
          month=$(date -u +%Y-%m)
          if [ "$(cat keepalive.txt 2>/dev/null)" != "$month" ]; then
            echo "$month" > keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "Keep-alive $month" && git push || echo "keep-alive skipped"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
